    function play(url) {
      teardown();
      currentUrl = url;
      var kind = detectKind(url);

      if (kind === 'embed') {
        var f = document.createElement('iframe');

        f.setAttribute('referrerpolicy', 'no-referrer');
        f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';

        return;

      }

      var video = document.createElement('video');
      video.controls = true; video.autoplay = true; video.playsInline = true;
      video.setAttribute('playsinline', '');
      stage.appendChild(video);

      if (kind === 'file') { video.src = url; return; }

      if (kind === 'hls') {
        if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = url; return; }
        loadScript('https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js').then(function () {

      if (!items.length) return;
      var g = document.createElement('div'); g.className = 'grp';
      var t = document.createElement('div'); t.className = 'glabel'; t.textContent = title;
      g.appendChild(t);

if (m) t.innerHTML = '<span class="date">' + esc(m[1]) + '</span>' + esc(m[2]);
else t.textContent = title;         // dentro de addGroup
      
    }
    function buildSources() {
      var box = root.querySelector('[data-sources]');
      box.innerHTML = '';
      var list = cfg.sources || [], order = [], byGroup = {};
      list.forEach(function (s) {
        var g = s.group || 'Fuentes';
        if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
        byGroup[g].push({ url: s.url, label: s.label || hostOf(s.url) });
      });
      order.forEach(function (g) { addGroup(box, g, byGroup[g]); });
      countEl.textContent = list.length;
    }

    /* ---------- Acciones ---------- */
    copyEl.addEventListener('click', function () {
      if (!currentUrl) return;
      var done = function () {
        var old = copyEl.textContent;
        copyEl.textContent = '\u00a1Copiado!';
        setTimeout(function () { copyEl.textContent = old; }, 1200);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(currentUrl).then(done, done);
        else done();
      } catch (e) { done(); }
    });
    stopEl.addEventListener('click', stop);

    buildSources();
    return root.__zfp;
  }

  /* ---------- API pÃºblica + auto-montaje ---------- */
  window.ZFP = { init: init, config: DEFAULT };

  function boot() {
    var base = window.ZFP_CONFIG || {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-zfp]'), function (el) {
      init(el, base);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
